[flake8]
max-line-length = 100
max-local-variables = 6

select = WPS, E99

extend-exclude =
  .venv
  venv

ignore =
  WPS111
  WPS110

  WPS201
  WPS202
  WPS203
  WPS211
  WPS214
  WPS235

  WPS412
  WPS410

  W503
  



# ``isinstance`` is allowed only in the raw perimeter (enforced by tests and
# by the project metrics gate).  NonEmptyMap no longer inherits dict methods
# that needed WPS214.
per-file-ignores =
    src/agentsparty/protocol/raw.py: WPS110
    # Re-export hubs: listing every public name is the facade's job (WPS203).
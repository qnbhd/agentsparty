name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deployment is driven by OIDC (`id-token`), not by a checked-in branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: uv sync --frozen --group docs
      - run: npm --prefix docs ci
      # `next.config.mjs` reads NEXT_PUBLIC_BASE_PATH; on a project site the
      # docs live under `/<repo>/`, which `configure-pages` reports as base_path.
      - run: npm --prefix docs run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out
      - uses: actions/deploy-pages@v5
        id: deploy

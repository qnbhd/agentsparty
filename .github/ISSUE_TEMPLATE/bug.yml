name: Bug
description: Something does not work as documented
title: '[bug] '
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentsparty version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Linux distribution if known
  - type: textarea
    id: protocol
    attributes:
      label: Minimal protocol
      description: Smallest choreography that reproduces the bug
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: text
